# Entorno completo: SQL Server 2022, RabbitMQ 4 (con Management Plugin), las tres APIs y el dashboard
# de Aspire como receptor OTLP para visualizar trazas y logs.
#
#   cp .env.example .env      # y edite las contraseñas
#   docker compose up --build
#
# Las tres bases de datos lógicas (PedidosDb, AlmacenDb, PagosDb) residen en la misma instancia
# por simplicidad, pero cada servicio solo recibe la cadena de conexión de la suya.

name: distributed-transactions

x-api-comun: &api-comun
  restart: unless-stopped
  networks: [red-interna]
  depends_on:
    sqlserver:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    aspire-dashboard:
      condition: service_started

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    hostname: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Defina SQL_SA_PASSWORD en .env}
    ports:
      - "${SQL_PUERTO:-14333}:1433"
    volumes:
      - sqlserver-datos:/var/opt/mssql
    networks: [red-interna]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.1-management
    # El nombre de nodo depende del hostname: fijarlo es imprescindible para que el volumen sea reutilizable.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:?Defina RABBITMQ_USUARIO en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD en .env}
    ports:
      - "${RABBITMQ_PUERTO:-5672}:5672"
      - "${RABBITMQ_PUERTO_GESTION:-15672}:15672"
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
    networks: [red-interna]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:${ASPIRE_DASHBOARD_ETIQUETA:-latest}
    environment:
      # Solo para desarrollo local: sin autenticación en el frontal ni en el receptor OTLP.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "${ASPIRE_DASHBOARD_PUERTO:-18888}:18888"
      # Receptor OTLP/gRPC publicado en el host: permite enviar trazas desde APIs lanzadas en el IDE.
      - "${ASPIRE_OTLP_PUERTO:-4317}:18889"
    networks: [red-interna]

  pedidos-api:
    <<: *api-comun
    build:
      context: .
      dockerfile: src/Servicios/Pedidos/Pedidos.Api/Dockerfile
    image: distributed-transactions/pedidos-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENTORNO:-Development}
      ConnectionStrings__PedidosDb: "Server=sqlserver,1433;Database=PedidosDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USUARIO}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      OTEL_SERVICE_NAME: pedidos-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "${PEDIDOS_PUERTO:-5001}:8080"

  almacen-api:
    <<: *api-comun
    build:
      context: .
      dockerfile: src/Servicios/Almacen/Almacen.Api/Dockerfile
    image: distributed-transactions/almacen-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENTORNO:-Development}
      ConnectionStrings__AlmacenDb: "Server=sqlserver,1433;Database=AlmacenDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USUARIO}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      SimulacionFallos__FallosAntesDeLiberarReserva: ${ALMACEN_FALLOS_LIBERACION:-0}
      OTEL_SERVICE_NAME: almacen-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "${ALMACEN_PUERTO:-5002}:8080"

  pagos-api:
    <<: *api-comun
    build:
      context: .
      dockerfile: src/Servicios/Pagos/Pagos.Api/Dockerfile
    image: distributed-transactions/pagos-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENTORNO:-Development}
      ConnectionStrings__PagosDb: "Server=sqlserver,1433;Database=PagosDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__rabbitmq: "amqp://${RABBITMQ_USUARIO}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      SimulacionPagos__ImporteMaximoAutorizado: ${PAGOS_IMPORTE_MAXIMO:-1000}
      OTEL_SERVICE_NAME: pagos-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "${PAGOS_PUERTO:-5003}:8080"

networks:
  red-interna:
    driver: bridge

volumes:
  sqlserver-datos:
  rabbitmq-datos:
